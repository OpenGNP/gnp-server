name: Deploy Server

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/opengnp/gnp-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /home/deploy/gnp

            docker compose pull gnp-server
            docker compose up -d gnp-server

            # Schema changes are NOT auto-applied here on purpose — review and
            # run `bun run push` by hand after a migration lands. See deploy/README.md.

            for i in 1 2 3 4 5; do
              sleep 2
              if curl -fsS http://127.0.0.1:3000/api/health; then
                echo "gnp-server is healthy"
                exit 0
              fi
            done

            echo "gnp-server did not become healthy after restart" >&2
            docker compose logs --tail=50 gnp-server >&2
            exit 1
