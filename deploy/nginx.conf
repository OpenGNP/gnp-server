# /etc/nginx/sites-available/gnp
# Serves the built client and reverse-proxies the API + docs to gnp-server.
# No domain yet: listens on plain :80 for the VPS's IP. Add server_name and
# certbot-managed TLS later if/when a domain is pointed at this box.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/gnp-client/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:3000/docs;
        proxy_set_header Host $host;
    }

    # SPA fallback: unknown paths resolve to index.html for client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
